<h2 mat-dialog-title>Create New Eval Set</h2>
<mat-dialog-content>
  Please enter the eval set name
</mat-dialog-content>
<mat-form-field style="padding-left:20px; padding-right: 24px;">
    <mat-label>Eval Set Name</mat-label>
    <input [(ngModel)]="newSetId" matInput (keydown.enter)="createNewEvalSet($event)">
  </mat-form-field>
@if (isEvalV2Enabled) {
<mat-form-field style="padding-left:20px; padding-right: 24px;">
    <mat-label>Execution Mode</mat-label>
    <mat-select [value]="executionMode" (selectionChange)="executionMode = $event.value">
      <mat-option value="live">Live</mat-option>
      <mat-option value="replay">Replay</mat-option>
    </mat-select>
  </mat-form-field>
}
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button cdkFocusInitial (click)="createNewEvalSet()">Create</button>
</mat-dialog-actions>
