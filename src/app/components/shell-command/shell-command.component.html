@if (command()) {
  <div class="shell-command">
    <!-- Kept on one line: whitespace between the spans would show up in the command. -->
    <div class="shell-command-line"><span class="shell-prompt">$ </span>@for (token of tokens(); track $index) {<span [class]="'shell-token-' + token.type">{{ token.text }}</span>}</div>
  </div>
} @else if (result(); as shellResult) {
  <app-terminal-output
    [stdout]="shellResult.stdout"
    [stderr]="shellResult.stderr"
    [error]="shellResult.error"
    [status]="status()"
  ></app-terminal-output>
}
