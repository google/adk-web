<div class="code-run">
  @if (executableCode()) {
    <div class="code-editor">
      <div class="code-panel-header">
        <span class="code-editor-tab">
          <mat-icon class="code-panel-icon">code</mat-icon>
          <span class="code-editor-language">{{ language().label }}</span>
        </span>
      </div>
      <div class="code-editor-body">
        <div class="code-editor-gutter" aria-hidden="true">
          @for (lineNumber of lineNumbers(); track lineNumber) {
            <div>{{ lineNumber }}</div>
          }
        </div>
        <div class="code-editor-code">
          <ng-container
            [ngComponentOutlet]="markdownComponent"
            [ngComponentOutletInputs]="{text: codeMarkdown(), thought: false}"
          ></ng-container>
        </div>
      </div>
    </div>
  }
  @if (result(); as codeResult) {
    <div class="code-output">
      <div class="code-panel-header">
        <mat-icon class="code-panel-icon">terminal</mat-icon>
        <span class="code-output-title">Output</span>
        @if (badge(); as statusBadge) {
          <span class="code-output-status status-{{ codeResult.status }}">
            <mat-icon class="code-output-status-icon">{{ statusBadge.icon }}</mat-icon>
            {{ statusBadge.label }}
          </span>
        }
      </div>
      <!-- A failed run's output is its stderr, such as a traceback. -->
      <app-terminal-output
        [boxed]="false"
        [stdout]="codeResult.status === 'failed' ? '' : codeResult.output"
        [stderr]="codeResult.status === 'failed' ? codeResult.output : ''"
      ></app-terminal-output>
    </div>
  }
</div>
